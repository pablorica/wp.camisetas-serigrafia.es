# docker-compose.yml — ONE file, identical in local and production.
#
# What differs between machines lives ONLY in .env:
#   - COMPOSE_PROFILES=local       (local)  -> also starts caddy
#   - COMPOSE_PROFILES=local,node  (local)  -> caddy + node watcher (when a plugin needs a build)
#   - COMPOSE_PROFILES=            (prod)   -> only mysql, wordpress, phpmyadmin
#   - URLs, ports, passwords, salts, APP_ENV, debug/cache flags
#
# Everything is named after PROJECT_NAME (e.g. camisetasparatodos):
#   containers  camisetasparatodos_mysql, _wordpress, _phpmyadmin, _caddy, _node
#   volumes     camisetasparatodos_mysql_data, camisetasparatodos_node_modules
#   network     camisetasparatodos_default
#
# Tools (one-off containers, removed when done):
#   docker compose run --rm wpcli plugin list
#   docker compose run --rm -w /var/www/html/wp-content/plugins/<plugin> composer install
#   docker compose run --rm -w /workspace/wp-content/plugins/<plugin> node npm run build
#
# Single-file mounts use the long syntax: if the file is missing, Docker refuses to
# start instead of silently creating an empty FOLDER with that name.

name: ${PROJECT_NAME:?Set PROJECT_NAME in .env}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: mysql:3306
  WORDPRESS_DB_USER: ${MYSQL_USER:?}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?}
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?}
  WORDPRESS_HOME: ${WORDPRESS_HOME:?Set WORDPRESS_HOME in .env (no trailing slash)}
  WORDPRESS_SSL_PORT: ${WORDPRESS_SSL_PORT:-443}
  WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-false}
  WORDPRESS_CACHE: ${WORDPRESS_CACHE:-false}
  APP_ENV: ${APP_ENV:?Set APP_ENV to local or production}
  ACF_PRO_LICENSE: ${ACF_PRO_LICENSE:-}
  WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:-}
  WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:-}
  WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:-}
  WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:-}
  WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:-}
  WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:-}
  WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:-}
  WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:-}

services:
  # ---------------------------------------------------------------- always on
  mysql:
    # = the exact version production ran before the migration (checked 2026-11-15).
    # Upgrade deliberately (both machines at once); MySQL can't downgrade 8.0.x data.
    image: mysql:8.0.44
    container_name: ${PROJECT_NAME}_mysql
    restart: unless-stopped
    cpus: 1.5        # was applied by hand on prod (docker update); now part of the config
    security_opt: ["no-new-privileges:true"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
      # No custom tuning: MySQL defaults on both machines (what both have really run so far)
    healthcheck:
      # $$ = evaluated inside the container, so the password isn't baked into the config
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    container_name: ${PROJECT_NAME}_wordpress
    restart: unless-stopped
    cpus: 3.0        # was applied by hand on prod (docker update); now part of the config
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mysql:
        condition: service_healthy
    # Localhost only. Production: host Nginx proxies here (WORDPRESS_PORT=8090).
    # Local: Caddy is the normal entry point; this is just a direct backdoor for debugging.
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:?}:80"
    environment:
      <<: *wp-env
    volumes:
      - ./wordpress:/var/www/html
      - type: bind
        source: ./wp-config.php
        target: /var/www/html/wp-config.php
        read_only: true
      - type: bind
        source: ./uploads.ini
        target: /usr/local/etc/php/conf.d/uploads.ini
        read_only: true
      # Logs OUTSIDE the web root, so they can't be downloaded over HTTP
      - ./logs:/var/log/wordpress

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ${PROJECT_NAME}_phpmyadmin
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mysql:
        condition: service_healthy
    # Localhost only. Production: Nginx /phpmyadmin/ + basic auth (PHPMYADMIN_PORT=8091).
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:?}:80"
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 64M
      # No auto-login, in either environment: log in with the MySQL user.

  # ---------------------------------------------------------------- tools (run on demand)
  wpcli:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/wpcli/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /var/www/html
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *wp-env
    volumes:
      - ./wordpress:/var/www/html
      - type: bind
        source: ./wp-config.php
        target: /var/www/html/wp-config.php
        read_only: true
      - type: bind
        source: ./uploads.ini
        target: /usr/local/etc/php/conf.d/uploads.ini
        read_only: true
      - ./logs:/var/log/wordpress
    entrypoint: ["wp"]

  composer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/composer/Dockerfile
    # Generic: pick the plugin with -w (see header). Same service for every plugin.
    working_dir: /var/www/html/wp-content
    #user: "${UID:-1000}:${GID:-1000}"   # uncomment on Linux to avoid root-owned vendor/
    volumes:
      - ./wordpress:/var/www/html
    entrypoint: ["composer"]

  # ---------------------------------------------------------------- local only
  node:
    # Watcher for whichever plugin/theme you're building: NODE_WORKDIR in .env,
    # relative to ./wordpress (e.g. wp-content/plugins/my-plugin).
    # Starts only with COMPOSE_PROFILES including "node".
    profiles: ["node"]
    image: node:20-alpine
    container_name: ${PROJECT_NAME}_node
    working_dir: /workspace/${NODE_WORKDIR:-wp-content}
    volumes:
      - ./wordpress:/workspace
      # node_modules in a container-only volume (speed + correct arch).
      # Switching NODE_WORKDIR to another plugin triggers a reinstall (lockfile differs).
      - node_modules:/workspace/${NODE_WORKDIR:-wp-content}/node_modules
    ports:
      - "${NODE_PORT:-5173}:${NODE_PORT:-5173}"
    environment:
      APP_URL: ${WORDPRESS_HOME}
      APP_HOST: ${CADDY_HOSTNAME:-}
      APP_PORT: ${WORDPRESS_SSL_PORT:-443}
      NODE_PORT: ${NODE_PORT:-5173}
      # CHOKIDAR_USEPOLLING: "true"   # if file-watching doesn't fire on Docker Desktop
    command:
      - sh
      - -lc
      - |
        if [ ! -f package.json ]; then
          echo ">> No package.json in $$PWD - set NODE_WORKDIR in .env"; exit 1
        fi
        if [ ! -f node_modules/.deps-installed ] || ! cmp -s package-lock.json node_modules/.deps-installed 2>/dev/null; then
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo ">> No package-lock.json found - generating one via npm install (commit it for reproducible npm ci)"
            npm install
          fi
          cp package-lock.json node_modules/.deps-installed 2>/dev/null || true
        fi
        npm run dev

  caddy:
    profiles: ["local"]
    image: caddy:2
    container_name: ${PROJECT_NAME}_caddy
    restart: unless-stopped
    depends_on:
      - wordpress
      - phpmyadmin
    ports:
      - "${WORDPRESS_SSL_PORT:-443}:${WORDPRESS_SSL_PORT:-443}"
    environment:
      WORDPRESS_SSL_PORT: ${WORDPRESS_SSL_PORT:-443}
      CADDY_HOSTNAME: ${CADDY_HOSTNAME:-}
      CADDY_PRODUCTION_DOMAIN: ${CADDY_PRODUCTION_DOMAIN:-}
      NODE_CONTAINER: ${PROJECT_NAME}_node        # for the (commented) Vite proxy in the Caddyfile
      NODE_PORT: ${NODE_PORT:-5173}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - ./certs:/etc/caddy/certs:ro
      - ./wordpress/wp-content/uploads:/var/www/html/wp-content/uploads:ro

volumes:
  mysql_data:          # -> <PROJECT_NAME>_mysql_data
  node_modules:        # -> <PROJECT_NAME>_node_modules (local only in practice)
