# Components that bin/release.sh packages and bin/deploy.sh installs.
#
#   type     theme | plugin  → goes to wp-content/themes/<name> or wp-content/plugins/<name>
#   name     folder name in wp-content (and in the zip)
#   path     folder in this repo
#   build    -         nothing to build
#            npm       npm ci && npm run build   (package.json + package-lock.json), then zip the folder
#            npm-dist  same, then zip the dist/ folder the build creates (sadoje, cg-woo-grid:
#                      their dist-build copies the plugin without sources and points the PHP to .min files)
#            composer  composer install --no-dev (runtime packages only)
#
# Files left out of every zip: see DEFAULT_EXCLUDES in bin/release.sh.
# Extra files to leave out of one component: a .distignore file in its folder (rsync patterns).
#
# type    name                 path                                              build
theme     sadoje               wordpress/wp-content/themes/sadoje                -
plugin    sadoje               wordpress/wp-content/plugins/sadoje               npm-dist
plugin    cg-woo-grid          wordpress/wp-content/plugins/cg-woo-grid          npm-dist
plugin    cpt-easy             wordpress/wp-content/plugins/cpt-easy             -
plugin    woo-color-importer   wordpress/wp-content/plugins/woo-color-importer   -
